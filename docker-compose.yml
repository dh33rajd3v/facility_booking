# Optional: run PostgreSQL in Docker instead of installing it.
# Start with `docker compose up -d postgres`; then set YOUR_PASSWORD in backend/.env to "postgres".
services:
  postgres:
    image: postgres:16
    container_name: facility-booking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:
